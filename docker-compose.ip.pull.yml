services:
  signal-web:
    image: ${SIGNAL_WEB_IMAGE:-ghcr.io/ask158/signal-web:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SIGNAL_DATA_DIR: /data
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - signal-data:/data
    networks:
      - signal-web-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 1.50
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      signal-web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
    networks:
      - signal-web-network
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  signal-web-network:
    driver: bridge

volumes:
  signal-data:
